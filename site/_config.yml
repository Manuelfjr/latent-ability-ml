title: Latent Ability
description: Browsable workshop site with section notes, activities, and answers for latent-ability-aware evaluation in machine learning.
baseurl: "/latent-ability-ml"
url: "https://manuelfjr.github.io"
markdown: kramdown
theme: null
permalink: pretty
repo_url: https://github.com/manuelfjr/latent-ability-ml

notebook_runtime_api_urls:
  - "https://manuelfjr-latent-ability-backend.hf.space"
admin_analytics_enabled: true

# ITA tutorial: false hides the "Gabarito" buttons and the /ita/gabarito/ page
# (useful while the room is still working; flip to true to release the answers).
ita_gabarito: true

# Root (/) and the pre-edition URLs redirect here.
default_edition: bristol
defaults:
  - scope:
      path: "bristol"
    values:
      edition: bristol
  - scope:
      path: "ita"
    values:
      edition: ita
      layout: ita
